{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Untasked{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Iconos de Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <link
      rel="icon"
      href="{% static 'images/untasked_logo.png' %}"
      type="image/png"
    />

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />

    {% block extra_css %}
    <!---->
    {% endblock %}
  </head>
  <body>
    <!-- HEADER SUPERIOR PÚRPURA CONTINUO -->
    <header
      class="top-header d-flex justify-content-between align-items-center px-4"
    >
      <!-- Logo untasked blanco -->
      <a
        href="{% url 'mis_tareas' %}"
        class="d-flex align-items-center gap-2 text-decoration-none"
      >
        <svg
          width="30"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect
            x="2"
            y="2"
            width="20"
            height="20"
            rx="6"
            stroke="#FFFFFF"
            stroke-width="2.5"
          />
          <path
            d="M7 12L10.5 15.5L17 8.5"
            stroke="#FFFFFF"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="fs-4 logo-text">untasked</span>
      </a>

      <!-- Avatar Perfil -->
      <div class="profile-avatar">
        <i class="bi bi-person fs-5"></i>
      </div>
    </header>

    <div class="d-flex">
      <!-- SIDEBAR BARRA LATERAL FIJA -->
      <aside
        class="sidebar d-flex flex-column justify-content-between p-3 flex-shrink-0"
      >
        <!-- Menú de Navegación Principal -->
        <nav class="d-flex flex-column gap-2 mt-2">
          <a
            href="{% url 'mis_tareas' %}"
            class="nav-link-custom {% if request.resolver_match.url_name == 'mis_tareas' %}active{% endif %}"
          >
            Tus tareas
          </a>

          <a
            href="{% url 'mis_cursos' %}"
            class="nav-link-custom {% if request.resolver_match.url_name == 'mis_cursos' %}active{% endif %}"
          >
            Tus cursos
          </a>
        </nav>

        <!-- Botón de Cerrar Sesión (Siempre visible al pie de la pantalla) -->
        <div class="pb-2">
          <form action="{% url 'logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button
              type="submit"
              class="btn-logout d-flex align-items-center gap-2"
            >
              <i class="bi bi-box-arrow-left"></i>
              <span>Cerrar sesión</span>
            </button>
          </form>
        </div>
      </aside>

      <!-- ÁREA DE CONTENIDO PRINCIPAL -->
      <main class="flex-grow-1 p-4" style="min-width: 0">
        {% block content %}
        <!---->
        {% endblock %}
      </main>
    </div>

    <!-- Script de Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
